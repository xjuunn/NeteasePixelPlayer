name: Build Phone APK (Release)

on:
  push:
    branches: [ master ]
    tags: [ "v*" ]
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-phone:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Restore release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "::error::Secret RELEASE_KEYSTORE_BASE64 未配置，无法产出正式签名的 release 包。"
            exit 1
          fi
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 -d > vz-pixelplay.jks

      - name: Create keystore.properties
        env:
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          echo "storePassword=$STORE_PASSWORD" > keystore.properties
          echo "keyAlias=$KEY_ALIAS" >> keystore.properties
          echo "keyPassword=$KEY_PASSWORD" >> keystore.properties

      - name: Build Phone release APK
        run: gradle :app:assembleRelease -Ppixelplay.enableAbiSplits=true

      - name: Verify Phone split APKs
        run: |
          BUILD_TOOLS_VERSION="$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)"
          for apk in \
            app/build/outputs/apk/release/app-arm64-v8a-release.apk \
            app/build/outputs/apk/release/app-armeabi-v7a-release.apk
          do
            "$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/aapt2" dump badging "$apk" >/dev/null
            "$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/apksigner" verify --verbose "$apk"
          done

      - name: Upload arm64-v8a APK artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: PixelPlay-arm64-v8a
          path: app/build/outputs/apk/release/app-arm64-v8a-release.apk
          if-no-files-found: error
          compression-level: 0

      - name: Upload armeabi-v7a APK artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: PixelPlay-armeabi-v7a
          path: app/build/outputs/apk/release/app-armeabi-v7a-release.apk
          if-no-files-found: error
          compression-level: 0

  publish-release:
    needs: build-phone
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download split APKs
        uses: actions/download-artifact@v7
        with:
          pattern: PixelPlay-*
          path: apk
          merge-multiple: true

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -l apk
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" apk/*.apk --clobber
          else
            gh release create "$TAG" apk/*.apk \
              --title "PixelPlay $TAG" \
              --generate-notes
          fi
